name: scheduled-scan

# Runs ONE scan per weekday morning on GitHub's runners (a home-ish IP that
# Finviz is less likely to 403 than the Streamlit Cloud data-center IP), then
# publishes the result to the `data` branch, which the read-only Streamlit app
# is deployed from. main stays code-only; the data branch is force-refreshed.
#
# Cadence: ONCE per day, weekdays only — never intraday, never weekends. The
# cron must never hit Finviz more than once per day automatically.
#
# Note (data semantics): 9:30 AM ET is the market OPEN, so this scan reads
# YESTERDAY's settled close plus the first ticks of today — a morning briefing,
# not a post-close watchlist build. If you prefer settled closing prices, move
# the cron to "30 21 * * 1-5" (17:30 ET) instead.

on:
  schedule:
    # 13:30 UTC = 9:30 AM ET during EDT (summer). In EST (winter) this fires at
    # 8:30 ET. Once per weekday.
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}        # allow manual runs from the Actions tab

permissions:
  contents: write              # needed to push the data branch

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scan and publish
        env:
          PINPOINT_REQUEST_DELAY: "2"      # gentler on the data source from CI
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}   # REQUIRED — add in repo Settings → Secrets
        run: python scan.py --all --publish --cache-top 250

      - name: Publish to data branch
        run: |
          # Abort rather than publish an empty/broken snapshot if the scan failed
          # to produce the read-only payload (e.g. missing API key, upstream 4xx).
          test -f data/latest_scan.json || { echo "::error::scan produced no data/latest_scan.json — not publishing"; exit 1; }
          git config user.name "pinpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B data main
          # Force-add each published artifact only if it exists, so a missing
          # optional file (earnings/ipo/theme history) can't fail the whole step.
          for p in data/latest_scan.json \
                   data/store/universe_latest.parquet data/store/universe_latest.json \
                   data/ohlcv data/theme_history.json data/ipo_highs.json \
                   data/earnings_watch.json; do
            [ -e "$p" ] && git add -f "$p" || echo "skip (absent): $p"
          done
          git commit -m "scheduled scan $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push -f origin data
